# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  seam:
    # The two rules that keep this package a renderer and nothing more. Both
    # are cheap and both are the kind of thing that erodes silently.
    runs-on: ubuntu-latest
    name: seam
    steps:
      - uses: actions/checkout@v4

      - name: no direct reads of a plan's @data
        run: |
          if grep -rn '@data' R/; then
            echo "::error::mediaplanr.viz reads projections, never @data."
            echo "Add the fact to a projection in mediaplanr instead."
            exit 1
          fi
          echo "ok: no @data in R/"

      - name: the dependency runs one way
        run: |
          git clone --depth 1 https://github.com/Roeh-Marketing/mediaplanr.git /tmp/mediaplanr
          if grep -qE '^\s*mediaplanr\.viz' /tmp/mediaplanr/DESCRIPTION; then
            echo "::error::mediaplanr depends on mediaplanr.viz; the arrow points the other way."
            exit 1
          fi
          echo "ok: mediaplanr does not depend on this package"

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
